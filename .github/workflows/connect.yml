name: Kanal verbinden

# Startet den Google-Login. Der Code erscheint auf der Website (und im Log dieses Laufs).
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: connect-channel
  cancel-in-progress: true

jobs:
  connect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q google-api-python-client google-auth
      - name: Mit Google anmelden
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          python connect_channel.py
          python build_dashboard.py
          git add content && (git diff --cached --quiet || git commit -qm "Website-Daten aktualisiert")
          git pull --rebase -q && git push -q
