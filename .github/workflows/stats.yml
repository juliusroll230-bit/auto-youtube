name: Statistiken holen

# Aufrufe und Likes für die Bestenliste, viermal am Tag.
on:
  schedule:
    - cron: "5 6,11,16,21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: post-shorts
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Statistiken holen
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          if [ -f content/channel.enc ] || [ -n "$YT_REFRESH_TOKEN" ]; then
            pip install -q google-api-python-client google-auth
            python fetch_stats.py
          else
            python build_dashboard.py
          fi
      - name: Speichern
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add content
          git diff --cached --quiet || git commit -qm "Statistiken aktualisiert"
          git pull --rebase -q && git push -q
