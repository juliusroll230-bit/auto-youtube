name: Shorts posten

on:
  schedule:
    # Läuft alle 30 Minuten zwischen 9 und 20 Uhr UTC. Das Skript entscheidet selbst,
    # ob gerade ein Sendeplatz (12, 17, 20 Uhr deutscher Zeit) fällig ist.
    - cron: "10,40 9-20 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Sofort ein Video posten, egal welche Uhrzeit"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: post-shorts
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ist ein Sendeplatz fällig?
        id: check
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then echo "due=true" >> "$GITHUB_OUTPUT"; else python post_next.py --check >> "$GITHUB_OUTPUT"; fi
          cat "$GITHUB_OUTPUT"

      - name: Abhängigkeiten installieren
        if: steps.check.outputs.due == 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q -r requirements.txt

      - name: Stimme laden (zwischengespeichert)
        if: steps.check.outputs.due == 'true'
        uses: actions/cache@v4
        with:
          path: models
          key: piper-de-thorsten-high-v1

      - name: Stimme herunterladen, falls nötig
        if: steps.check.outputs.due == 'true'
        run: |
          if [ ! -f models/vits-piper-de_DE-thorsten-high/de_DE-thorsten-high.onnx ]; then
            mkdir -p models && cd models
            curl -sSL -o voice.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-de_DE-thorsten-high.tar.bz2
            tar xjf voice.tar.bz2 && rm voice.tar.bz2
          fi

      - name: Video erstellen und hochladen
        if: steps.check.outputs.due == 'true'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          PRIVACY: ${{ vars.PRIVACY || 'public' }}
        run: python post_next.py ${{ inputs.force && '--force' || '' }}

      - name: Fortschritt speichern
        if: steps.check.outputs.due == 'true'
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add content
          git diff --cached --quiet || git commit -m "Short gepostet"
          git push
